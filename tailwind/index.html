<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore the Skins collection of serums, cleansers, creams and lotions.">
    <title>Skins | Skincare</title>
    <link rel="stylesheet" href="./assets/tailwind.css">
    <script src="./src/storefront.js" defer></script>
  </head>
  <body class="flex min-h-dvh flex-col bg-blush font-sans text-ink">
    <header id="home">
      <div class="grid bg-rose text-center text-xs text-muted min-[480px]:grid-cols-2">
        <p class="flex min-h-8 items-center justify-center gap-1.5 px-2 py-1.5 md:h-[clamp(1.75rem,2.92vw,2.65rem)] md:min-h-0">
          <img class="size-3.5 shrink-0" src="./assets/icons/truck.svg" alt="">
          Free shipping on orders over 100£
        </p>
        <p class="flex min-h-8 items-center justify-center gap-1.5 border-t border-muted/55 px-2 py-1.5 min-[480px]:border-t-0 min-[480px]:border-l md:min-h-0">
          <img class="size-3.5 shrink-0" src="./assets/icons/gift.svg" alt="">
          Get 10% off your first order - Code: WELCOME10
        </p>
      </div>

      <div class="grid grid-cols-[1fr_auto] items-center gap-x-4 px-4 md:h-[clamp(2.75rem,4.72vw,4.5rem)] md:grid-cols-[1fr_auto_1fr] md:pr-[8.4%] md:pl-[13.4%]">
        <a href="#home" class="w-fit text-[clamp(1.5rem,2.22vw,2rem)] leading-none">Skins</a>
        <nav aria-label="Main navigation" class="col-span-2 row-start-2 flex min-h-10 items-center justify-center gap-x-4 text-[clamp(.75rem,1.08vw,1rem)] tracking-[.16em] uppercase md:col-span-1 md:row-auto md:gap-x-[clamp(.5rem,.9vw,1rem)]">
          <a class="hover:underline" href="#home">Home</a>
          <a class="hover:underline" href="#shop">Shop</a>
          <button class="uppercase hover:underline" type="button" data-panel="about">About</button>
          <button class="uppercase hover:underline" type="button" data-panel="contact">Contact</button>
        </nav>
        <div class="flex items-center justify-end">
          <form id="search-form" role="search" class="flex items-center">
            <label for="search" class="sr-only">Search products</label>
            <input id="search" type="search" placeholder="Search" autocomplete="off"
              class="h-9 w-[clamp(5rem,27vw,11rem)] rounded-xl bg-search px-3 text-sm placeholder:text-search-ink md:h-[clamp(1.55rem,2.59vw,2.35rem)] md:w-[clamp(6rem,14.8vw,13.25rem)] md:px-[clamp(.7rem,2.75vw,2.5rem)] md:text-[clamp(.75rem,.99vw,.875rem)]">
            <button type="submit" class="header-icon" aria-label="Search products">
              <img class="size-4" src="./assets/icons/search.svg" alt="">
            </button>
          </form>
          <button type="button" class="header-icon" aria-label="Favorites" data-panel="favorites">
            <img class="size-4" src="./assets/icons/heart.svg" alt="">
          </button>
          <button type="button" class="header-icon relative" aria-label="Shopping bag" data-panel="bag">
            <img class="size-4" src="./assets/icons/bag.svg" alt="">
            <span id="bag-count" hidden class="absolute top-0 right-0 min-w-4 rounded-full bg-cocoa px-0.5 text-center text-[10px] leading-4 text-white"></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section aria-label="Skins skincare">
        <h1 class="sr-only">Skins skincare</h1>
        <img src="./assets/hero.jpg" width="2172" height="724" fetchpriority="high"
          alt="A woman resting her head on her hand beside Skins skincare and blush flowers"
          class="aspect-[3/2] w-full bg-peach object-cover object-[54%_center] sm:aspect-[2.4/1] md:aspect-[3.12/1] md:object-center">
      </section>

      <section id="shop" aria-labelledby="shop-title" class="px-5 pt-7 pb-5 md:px-0 md:pt-[3.98vw] md:pb-[1.34vw]">
        <h2 id="shop-title" class="sr-only">Shop skincare</h2>
        <p id="search-status" class="sr-only" aria-live="polite"></p>
        <div class="mx-auto grid max-w-xl grid-cols-2 gap-x-5 gap-y-6 md:max-w-none md:w-4/5 md:-translate-x-[.75vw] md:grid-cols-4 md:gap-x-[5.25vw]">
          <button type="button" data-product="serum" data-name="Hydrating Serum" data-description="Soft, glowing and hydrated skin"
            class="product-card group">
            <img class="product-photo" src="./assets/serum.jpg" alt="" width="1254" height="1254">
            <span class="group-hover:underline">Serum</span>
          </button>
          <button type="button" data-product="cleanser" data-name="Gentle Cleanser" data-description="A gentle first step in your skincare routine."
            class="product-card group">
            <img class="product-photo" src="./assets/cleanser.jpg" alt="" width="1254" height="1254">
            <span class="group-hover:underline">Cleanser</span>
          </button>
          <button type="button" data-product="cream" data-name="Daily Glow Cream" data-description="A face cream for your everyday skincare routine."
            class="product-card group">
            <img class="product-photo" src="./assets/cream.jpg" alt="" width="1254" height="1254">
            <span class="group-hover:underline">Cream</span>
          </button>
          <button type="button" data-product="lotion" data-name="Hydrating Lotion" data-description="A moisturizing lotion in an easy-to-use pump bottle."
            class="product-card group">
            <img class="product-photo" src="./assets/lotion.jpg" alt="" width="1254" height="1254">
            <span class="group-hover:underline">Lotion</span>
          </button>
        </div>
        <p id="search-empty" hidden class="px-4 py-8 text-center">No products match your search.</p>
      </section>

      <section aria-labelledby="bestseller-title" class="bg-rose">
        <div class="mx-auto grid max-w-xl items-center gap-5 px-5 py-5 min-[480px]:grid-cols-2 md:ml-[4.2%] md:min-h-[7.75rem] md:w-[88.6%] md:max-w-none md:gap-0 md:p-0">
          <img src="./assets/serum.jpg" alt="Skins hydrating serum in a pink glass dropper bottle" width="1254" height="1254"
            class="aspect-[1.05/1] w-full max-w-44 justify-self-center rounded-2xl object-cover md:w-[14.25vw] md:max-w-none">
          <div class="text-center text-[clamp(.875rem,1.11vw,1rem)] leading-relaxed">
            <h2 id="bestseller-title" class="mb-3 font-semibold md:mb-[1.1vw] md:font-medium">Our bestseller</h2>
            <p>Hydrating Serum</p>
            <p>Soft, glowing and hydrated skin</p>
            <button type="button" data-open-product="serum" class="mt-3 min-h-10 rounded-full bg-blush px-3 text-xs uppercase hover:bg-white md:mt-[.85vw] md:min-h-[clamp(1.6rem,2.16vw,2rem)] md:px-2">Shop now</button>
          </div>
        </div>
      </section>
    </main>

    <footer id="contact" class="grow bg-cocoa px-6 pt-6 pb-7 text-center text-xs tracking-[.08em] text-blush md:min-h-[13.9vw] md:pt-[2.65vw] md:pb-[2vw]">
      <div class="mx-auto flex max-w-md flex-wrap items-center justify-center gap-x-14 gap-y-2 md:grid md:max-w-none md:w-[68%] md:grid-cols-2">
        <div class="flex items-center justify-center gap-2">
          <button class="footer-icon" type="button" data-panel="youtube" aria-label="YouTube">
            <img class="size-4" src="./assets/icons/video.svg" alt="">
          </button>
          <button class="footer-icon" type="button" data-panel="whatsapp" aria-label="WhatsApp">
            <img class="size-4" src="./assets/icons/phone.svg" alt="">
          </button>
          <button class="footer-icon" type="button" data-panel="messenger" aria-label="Messenger">
            <img class="size-4" src="./assets/icons/chat.svg" alt="">
          </button>
        </div>
        <nav aria-label="Footer navigation" class="flex items-center justify-center gap-5">
          <button type="button" class="min-h-9 hover:underline md:min-h-[clamp(1.75rem,2.5vw,2.25rem)]" data-panel="contact">Contact</button>
          <button type="button" class="min-h-9 hover:underline md:min-h-[clamp(1.75rem,2.5vw,2.25rem)]" data-panel="address">Address</button>
          <button type="button" class="min-h-9 hover:underline md:min-h-[clamp(1.75rem,2.5vw,2.25rem)]" data-panel="policy">Policy</button>
        </nav>
      </div>
      <p class="mt-8 leading-relaxed md:mt-[3.45vw] md:leading-normal">Skins<br>© Copyright 2026</p>
    </footer>

    <dialog id="store-dialog" aria-labelledby="dialog-title" class="fixed inset-0 m-auto max-h-[90dvh] w-[min(29rem,calc(100%-2rem))] rounded-2xl bg-blush p-6 text-ink backdrop:bg-cocoa/55 sm:p-8">
      <form method="dialog" class="absolute top-3 right-3">
        <button type="submit" class="grid size-10 place-items-center rounded-full hover:bg-search" aria-label="Close">
          <img class="size-5" src="./assets/icons/close.svg" alt="">
        </button>
      </form>
      <h2 id="dialog-title" class="mb-4 pr-10 text-2xl font-medium"></h2>
      <div id="dialog-content"></div>
    </dialog>
  </body>
</html>
